<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>سامانه پیگیری ثبت‌نام تامین‌کنندگان</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --bg:#f3f5fb; --surface:#ffffff; --surface2:#f7f8fd; --text:#1b1f3b; --muted:#6b7194;
  --border:#e4e7f4; --primary:#5b5bf0; --primary2:#8a5cf6; --primary-soft:#ecebff;
  --ok:#12b886; --ok-soft:#dcf7ee; --warn:#f59f00; --warn-soft:#fff3d6; --bad:#f03e5f; --bad-soft:#ffe3e8;
  --info:#1c9bd8; --info-soft:#dff3fc;
  --shadow:0 10px 30px -12px rgba(60,60,160,.25); --radius:18px;
}
[data-theme="dark"]{
  --bg:#0e1020; --surface:#171a30; --surface2:#1d2140; --text:#eceefc; --muted:#9aa0c7;
  --border:#2a2f55; --primary:#7c7cff; --primary2:#b18cff; --primary-soft:#262a55;
  --ok-soft:#10382f; --warn-soft:#3d3010; --bad-soft:#401b27; --info-soft:#10303f;
  --shadow:0 10px 30px -12px rgba(0,0,0,.6);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Vazirmatn',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.7;
  background-image:radial-gradient(900px 400px at 100% -10%,rgba(91,91,240,.18),transparent),radial-gradient(700px 400px at 0% 0%,rgba(138,92,246,.14),transparent);
  background-attachment:fixed;transition:background .3s,color .3s}
button,input,select,textarea{font-family:inherit;font-size:.95rem;color:inherit}
.wrap{max-width:1280px;margin:0 auto;padding:22px 18px 60px}

/* header */
header{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:22px}
.brand{display:flex;align-items:center;gap:14px}
.logo{width:54px;height:54px;border-radius:16px;background:linear-gradient(135deg,var(--primary),var(--primary2));display:grid;place-items:center;color:#fff;box-shadow:0 10px 24px -8px var(--primary)}
.logo svg{width:28px;height:28px}
.brand h1{font-size:1.35rem;font-weight:800;letter-spacing:-.3px}
.brand p{font-size:.85rem;color:var(--muted)}
.head-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.today-chip{background:var(--surface);border:1px solid var(--border);padding:8px 14px;border-radius:999px;font-size:.85rem;color:var(--muted);box-shadow:var(--shadow)}

/* buttons */
.btn{border:0;cursor:pointer;border-radius:12px;padding:10px 18px;font-weight:600;display:inline-flex;align-items:center;gap:8px;transition:.2s;background:var(--surface);color:var(--text);border:1px solid var(--border)}
.btn:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.btn.primary{background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;border:0;box-shadow:0 10px 22px -10px var(--primary)}
.btn.danger{color:var(--bad)}
.btn.icon{padding:9px;border-radius:12px}
.btn svg{width:18px;height:18px;flex:none}

/* stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:22px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);cursor:pointer;position:relative;overflow:hidden;transition:.25s}
.stat:hover{transform:translateY(-4px)}
.stat.active{outline:2px solid var(--primary)}
.stat .ico{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;margin-bottom:10px}
.stat .ico svg{width:22px;height:22px}
.stat .num{font-size:1.9rem;font-weight:800;line-height:1.2}
.stat .lbl{font-size:.85rem;color:var(--muted)}
.stat .bar{height:6px;border-radius:6px;background:var(--border);margin-top:10px;overflow:hidden}
.stat .bar i{display:block;height:100%;border-radius:6px;transition:width .6s}
.c-pri .ico{background:var(--primary-soft);color:var(--primary)} .c-pri .bar i{background:var(--primary)}
.c-info .ico{background:var(--info-soft);color:var(--info)} .c-info .bar i{background:var(--info)}
.c-ok .ico{background:var(--ok-soft);color:var(--ok)} .c-ok .bar i{background:var(--ok)}
.c-bad .ico{background:var(--bad-soft);color:var(--bad)} .c-bad .bar i{background:var(--bad)}
.c-warn .ico{background:var(--warn-soft);color:var(--warn)} .c-warn .bar i{background:var(--warn)}

/* toolbar */
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.toolbar{padding:16px;display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.search{position:relative;flex:1 1 260px}
.search svg{position:absolute;right:14px;top:50%;transform:translateY(-50%);width:18px;color:var(--muted)}
.search input{padding-right:42px}
input,select,textarea{width:100%;background:var(--surface2);border:1.5px solid var(--border);border-radius:12px;padding:10px 14px;outline:none;transition:.2s}
input:focus,select:focus,textarea:focus{border-color:var(--primary);box-shadow:0 0 0 4px var(--primary-soft)}
.toolbar select{width:auto;min-width:150px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.tab{padding:8px 16px;border-radius:999px;border:1px solid var(--border);background:var(--surface);cursor:pointer;font-weight:600;font-size:.88rem;color:var(--muted);transition:.2s}
.tab.active{background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;border-color:transparent}
.tab b{margin-right:6px;background:rgba(127,127,127,.18);border-radius:999px;padding:0 8px;font-size:.78rem}

/* table */
.table-wrap{overflow-x:hidden;border-radius:var(--radius)}
body{overflow-x:hidden}
table{width:100%;border-collapse:collapse;table-layout:auto}
th{position:sticky;top:0;background:var(--surface2);text-align:right;padding:12px 8px;font-size:.78rem;color:var(--muted);font-weight:700;border-bottom:1px solid var(--border)}
td{padding:12px 8px;border-bottom:1px solid var(--border);font-size:.86rem;vertical-align:middle;overflow-wrap:anywhere}
tbody tr{transition:.15s}
tbody tr:hover{background:var(--surface2)}
.name{font-weight:700}
.sub{font-size:.78rem;color:var(--muted)}
.ltr{direction:ltr;unicode-bidi:embed;display:inline-block}
.badge{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:999px;font-size:.78rem;font-weight:700;white-space:nowrap;cursor:pointer;border:0;user-select:none}
.badge::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.b-ok{background:var(--ok-soft);color:var(--ok)} .b-bad{background:var(--bad-soft);color:var(--bad)}
.b-warn{background:var(--warn-soft);color:var(--warn)} .b-info{background:var(--info-soft);color:var(--info)}
.b-mute{background:var(--border);color:var(--muted)} .b-mute::before{opacity:.5}
.plat{display:inline-block;padding:3px 12px;border-radius:8px;background:var(--primary-soft);color:var(--primary);font-weight:600;font-size:.8rem}
.row-actions{display:flex;gap:6px}
.row-actions .btn{padding:6px;border-radius:10px}
.empty{text-align:center;padding:60px 20px;color:var(--muted)}
.empty svg{width:70px;height:70px;opacity:.5;margin-bottom:10px}
.count-line{padding:12px 16px;font-size:.85rem;color:var(--muted);display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(10,12,30,.55);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;padding:14px;overflow:auto;z-index:50}
.overlay.open{display:flex}
.modal{background:var(--surface);border-radius:24px;width:100%;max-width:880px;box-shadow:0 30px 80px -20px rgba(0,0,0,.5);animation:pop .3s ease;margin:auto}
@keyframes pop{from{opacity:0;transform:translateY(20px) scale(.97)}to{opacity:1;transform:none}}
.modal-head{padding:12px 22px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border)}
.modal-head h2{font-size:1.15rem}
.modal-body{padding:16px 22px;display:grid;grid-template-columns:repeat(3,1fr);gap:12px 16px}
.full{grid-column:1/-1}
label{display:block;font-size:.82rem;font-weight:600;margin-bottom:4px}
label .req{color:var(--bad)}
.hint{font-size:.76rem;color:var(--muted);margin-top:4px}
.section-title{grid-column:1/-1;font-weight:800;font-size:.9rem;color:var(--primary);display:flex;align-items:center;gap:10px;margin-top:6px}
.section-title::after{content:"";flex:1;height:1px;background:var(--border)}
.date-row{display:grid;grid-template-columns:1fr 1.5fr 1fr;gap:6px}
.modal input,.modal select{padding:8px 10px}
.modal .date-row select{padding:8px 4px}
.date-row .btn{padding:8px 12px}
.seg{display:flex;background:var(--surface2);border:1.5px solid var(--border);border-radius:12px;padding:4px;gap:4px}
.seg label{flex:1;margin:0;text-align:center;padding:5px 4px;border-radius:9px;cursor:pointer;font-weight:600;color:var(--muted);transition:.2s;font-size:.85rem}
.seg input{display:none}
.seg input:checked+span{display:block}
.seg label:has(input:checked){color:#fff}
.seg label:has(input[value="yes"]:checked){background:var(--ok)}
.seg label:has(input[value="no"]:checked){background:var(--bad)}
.seg label:has(input[value="na"]:checked){background:var(--muted)}
.invalid{border-color:var(--bad)!important}
.err{color:var(--bad);font-size:.76rem;margin-top:4px;display:none}
.modal-foot{padding:12px 22px;border-top:1px solid var(--border);display:flex;gap:10px;justify-content:flex-start}

/* toast */
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(100px);background:var(--text);color:var(--bg);padding:12px 22px;border-radius:14px;font-weight:600;transition:.4s;z-index:99;box-shadow:var(--shadow)}
#toast.show{transform:translateX(-50%) translateY(0)}

@media(min-width:981px){
  td:nth-child(3),td:nth-child(4){white-space:nowrap}
  th:nth-child(2){width:26%}
}
@media(max-width:980px){
  thead{display:none}
  table,tbody,tr,td{display:block;width:100%}
  tbody tr{padding:12px 6px;border-bottom:8px solid var(--bg)}
  td{display:flex;justify-content:space-between;align-items:center;gap:12px;border:0;padding:6px 12px;text-align:left}
  td::before{content:attr(data-label);color:var(--muted);font-weight:600;font-size:.8rem;flex:none}
  td>*{text-align:left}
}
@media(max-width:640px){
  .modal-body{grid-template-columns:1fr 1fr}
  .full{grid-column:1/-1}
}
@media print{
  body{background:#fff;color:#000}
  header .head-actions,.toolbar,.tabs,.stats,.row-actions,.no-print,.count-line button{display:none!important}
  .panel{box-shadow:none;border:0} table{font-size:.72rem}
}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>
<div class="wrap">

<header>
  <div class="brand">
    <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 14a3.5 3.5 0 0 0 5 0l3-3a3.5 3.5 0 0 0-5-5l-1 1"/><path d="M14 10a3.5 3.5 0 0 0-5 0l-3 3a3.5 3.5 0 0 0 5 5l1-1"/></svg></div>
    <div>
      <h1>سامانه پیگیری ثبت‌نام تامین‌کنندگان</h1>
      <p>ثبت لینک‌های ارسال‌شده و پیگیری وضعیت ثبت‌نام در سامانه وندور</p>
    </div>
  </div>
  <div class="head-actions">
    <span class="today-chip" id="todayChip"></span>
    <button class="btn icon" id="themeBtn" title="تغییر تم" aria-label="تغییر تم">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
    <button class="btn primary" id="addBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      ثبت تامین‌کننده جدید
    </button>
  </div>
</header>

<section class="stats" id="stats"></section>

<div class="panel toolbar">
  <div class="search">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" placeholder="جستجو در نام، موبایل، مسئول، معرف، نام در سامانه…" autocomplete="off">
  </div>
  <select id="fPlat"><option value="">همه بسترها</option></select>
  <select id="fRef"><option value="">همه معرف‌ها</option></select>
  <button class="btn" id="resetBtn">پاک‌کردن فیلترها</button>
</div>

<div class="tabs" id="tabs"></div>

<div class="panel">
  <div class="count-line no-print">
    <span id="countTxt"></span>
    <span style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn" id="csvBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0-4-4m4 4 4-4M4 21h16"/></svg>خروجی اکسل</button>
      <button class="btn" id="printBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9V3h12v6M6 18H4v-7h16v7h-2M6 14h12v7H6z"/></svg>چاپ گزارش</button>
      <button class="btn" id="backupBtn">پشتیبان‌گیری</button>
      <button class="btn" id="restoreBtn">بازیابی</button>
      <input type="file" id="restoreFile" accept=".json" hidden>
    </span>
  </div>
  <div class="table-wrap">
    <table>
      <thead><tr>
        <th>#</th><th>نام مجموعه</th><th>موبایل</th><th>تاریخ دریافت</th><th>مسئول / معرف</th>
        <th>لینک ارسال</th><th>ثبت‌نام</th><th>زمینه فعالیت</th><th>مستندات</th><th>تایید نهایی</th><th class="no-print">عملیات</th>
      </tr></thead>
      <tbody id="tbody"></tbody>
    </table>
    <div class="empty" id="empty" style="display:none">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
      <div>موردی برای نمایش وجود ندارد</div>
    </div>
  </div>
</div>
</div>

<!-- modal -->
<div class="overlay" id="overlay">
  <form class="modal" id="form" novalidate>
    <div class="modal-head">
      <h2 id="mTitle">ثبت تامین‌کننده جدید</h2>
      <button type="button" class="btn icon" id="closeBtn" aria-label="بستن"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </div>
    <div class="modal-body">
      <div>
        <label>نام مجموعه <span class="req">*</span></label>
        <input id="name" placeholder="مثلاً: شرکت آسان‌بر پارس">
        <div class="err" id="eName">نام مجموعه را وارد کنید.</div>
      </div>
      <div>
        <label>شماره موبایل <span class="req">*</span></label>
        <input id="mobile" inputmode="numeric" maxlength="11" placeholder="09123456789" style="direction:ltr;text-align:right">
        <div class="err" id="eMobile"></div>
      </div>
      <div>
        <label>تاریخ دریافت اطلاعات</label>
        <div class="date-row"><select id="dy"></select><select id="dm"></select><select id="dd"></select></div>
      </div>
      <div>
        <label>فرد مسئول مجموعه</label>
        <input id="contact" placeholder="نام مسئول">
      </div>
      <div>
        <label>معرف (کارشناس ما)</label>
        <input id="referrer" list="refList" placeholder="نام کارشناس معرف">
        <datalist id="refList"></datalist>
      </div>
      <div>
        <label>بستر ارسال لینک</label>
        <select id="platform"><option value="">انتخاب کنید…</option></select>
      </div>
      <div>
        <label>لینک ارسال شده؟</label>
        <div class="seg">
          <label><input type="radio" name="link" value="no" checked><span>خیر</span></label>
          <label><input type="radio" name="link" value="yes"><span>بله</span></label>
        </div>
      </div>
      <div>
        <label>ثبت‌نام شده؟</label>
        <div class="seg" id="segReg">
          <label><input type="radio" name="reg" value="no" checked><span>خیر</span></label>
          <label><input type="radio" name="reg" value="yes"><span>بله</span></label>
        </div>
      </div>
      <div>
        <label>زمینه فعالیت انتخاب شده؟</label>
        <div class="seg" id="segAct">
          <label><input type="radio" name="act" value="no" checked><span>خیر</span></label>
          <label><input type="radio" name="act" value="yes"><span>بله</span></label>
        </div>
      </div>
      <div>
        <label>مستندات بارگذاری شده؟</label>
        <div class="seg">
          <label><input type="radio" name="docs" value="no" checked><span>خیر</span></label>
          <label><input type="radio" name="docs" value="yes"><span>بله</span></label>
        </div>
      </div>
      <div>
        <label>تایید نهایی شده؟</label>
        <div class="seg">
          <label><input type="radio" name="fin" value="no" checked><span>خیر</span></label>
          <label><input type="radio" name="fin" value="yes"><span>بله</span></label>
        </div>
      </div>
      <div>
        <label>نام در سامانه وندور <span class="sub">(اگر فرق دارد)</span></label>
        <input id="regName" placeholder="نام ثبت‌شده در سامانه">
      </div>
      <div class="full">
        <input id="notes" placeholder="توضیحات (اختیاری)">
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn primary" type="submit">ذخیره</button>
      <button class="btn" type="button" id="cancelBtn">انصراف</button>
    </div>
  </form>
</div>
<div id="toast"></div>

<script>
(() => {
'use strict';
const PLATFORMS = ['ایتا','بله','روبیکا','واتساپ','تلگرام'];
const MONTHS = ['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
const $ = id => document.getElementById(id);
const toFa = s => String(s).replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);
const toEn = s => String(s).replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- Jalali conversion ---------- */
function div(a,b){return ~~(a/b)}
function g2j(gy,gm,gd){
  const gdm=[0,31,59,90,120,151,181,212,243,273,304,334];
  let jy = gy>1600 ? 979 : 0; gy -= gy>1600 ? 1600 : 621;
  const gy2 = gm>2 ? gy+1 : gy;
  let days = 365*gy + div(gy2+3,4) - div(gy2+99,100) + div(gy2+399,400) - 80 + gd + gdm[gm-1];
  jy += 33*div(days,12053); days %= 12053;
  jy += 4*div(days,1461); days %= 1461;
  if(days>365){ jy += div(days-1,365); days = (days-1)%365; }
  const jm = days<186 ? 1+div(days,31) : 7+div(days-186,30);
  const jd = 1 + (days<186 ? days%31 : (days-186)%30);
  return [jy,jm,jd];
}
function j2g(jy,jm,jd){
  let gy = jy>979 ? 1600 : 621; jy -= jy>979 ? 979 : 0;
  let days = 365*jy + div(jy,33)*8 + div((jy%33)+3,4) + 78 + jd + (jm<7 ? (jm-1)*31 : (jm-7)*30+186);
  gy += 400*div(days,146097); days %= 146097;
  if(days>36524){ gy += 100*div(--days,36524); days %= 36524; if(days>=365) days++; }
  gy += 4*div(days,1461); days %= 1461;
  if(days>365){ gy += div(days-1,365); days = (days-1)%365; }
  let gd = days+1;
  const sal=[0,31,(gy%4===0&&gy%100!==0)||gy%400===0?29:28,31,30,31,30,31,31,30,31,30,31];
  let gm; for(gm=0; gm<13 && gd>sal[gm]; gm++) gd -= sal[gm];
  return [gy,gm,gd];
}
const jLeap = y => [1,5,9,13,17,22,26,30].includes(y%33);
const jDays = (y,m) => m<=6 ? 31 : (m<=11 ? 30 : (jLeap(y)?30:29));
const pad = n => String(n).padStart(2,'0');
const isoToJ = iso => { if(!iso) return null; const [y,m,d]=iso.split('-').map(Number); return g2j(y,m,d); };
const jToIso = (y,m,d) => { const [gy,gm,gd]=j2g(y,m,d); return `${gy}-${pad(gm)}-${pad(gd)}`; };
const fmtJ = iso => { const j=isoToJ(iso); return j ? toFa(`${j[0]}/${pad(j[1])}/${pad(j[2])}`) : '—'; };
const nowJ = () => { const n=new Date(); return g2j(n.getFullYear(),n.getMonth()+1,n.getDate()); };

const SUPABASE_URL = 'https://woqslxevzwvemsfhjrqt.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndvcXNseGV2end2ZW1zZmhqcnF0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMyNTc4MTksImV4cCI6MjEwODgzMzgxOX0.8sU76xHeMz0zbMs0_zXV8TLHbQ0zZDQ9dZYJWAL1DZs';

const toDb = r => ({
  id: r.id,
  created: r.created || Date.now(),
  name: r.name || '',
  mobile: r.mobile || '',
  date: r.date || null,
  contact: r.contact || '',
  referrer: r.referrer || '',
  link_sent: !!r.linkSent,
  platform: r.platform || '',
  docs: !!r.docs,
  final: !!r.final,
  registered: !!r.registered,
  activity: !!r.activity,
  reg_name: r.regName || '',
  notes: r.notes || ''
});
const fromDb = r => ({
  id: r.id,
  created: r.created,
  name: r.name,
  mobile: r.mobile,
  date: r.date,
  contact: r.contact,
  referrer: r.referrer,
  linkSent: !!r.link_sent,
  platform: r.platform,
  docs: !!r.docs,
  final: !!r.final,
  registered: !!r.registered,
  activity: !!r.activity,
  regName: r.reg_name,
  notes: r.notes
});

let data = [];
let editId = null;
let view = 'all';

async function load() {
  try {
    const { data: rows, error } = await sb.from('vendors').select('*').order('created', { ascending: false });
    if (error) throw error;
    data = (rows || []).map(fromDb);
  } catch (e) {
    console.error(e);
    toast('خطا در خواندن اطلاعات از سرور');
    data = [];
  }
}

async function saveRecord(rec) {
  const row = toDb(rec);
  const { error } = await sb.from('vendors').upsert(row);
  if (error) throw error;
}

async function deleteRecord(id) {
  const { error } = await sb.from('vendors').delete().eq('id', id);
  if (error) throw error;
}

const toast = msg => { const t=$('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toast.t); toast.t=setTimeout(()=>t.classList.remove('show'),2400); };

/* ---------- filters ---------- */
const tabsDef = [
  ['all','همه', r=>true],
  ['sent','لینک ارسال‌شده', r=>r.linkSent],
  ['notsent','لینک ارسال‌نشده', r=>!r.linkSent],
  ['reg','ثبت‌نام شده', r=>r.registered],
  ['unreg','ثبت‌نام نشده', r=>!r.registered],
  ['follow','پیگیری زمینه فعالیت', r=>r.registered && !r.activity],
  ['docs','مستندات ارسال‌شده', r=>r.docs],
  ['nodocs','مستندات ارسال‌نشده', r=>r.registered && !r.docs],
  ['wait','منتظر تایید نهایی', r=>r.docs && !r.final],
  ['final','تایید نهایی شده', r=>r.final],
];
const statKeys = ['all','sent','reg','follow','docs','final'];
function filtered(forCount){
  const q = toEn($('q').value.trim().toLowerCase());
  const fp = $('fPlat').value, fr = $('fRef').value;
  const tab = tabsDef.find(t=>t[0]===view);
  return data.filter(r=>{
    if(!forCount && !tab[2](r)) return false;
    if(fp && r.platform!==fp) return false;
    if(fr && r.referrer!==fr) return false;
    if(q){
      const hay = [r.name,r.mobile,r.contact,r.referrer,r.regName,r.notes].join(' ').toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  }).sort((a,b)=> (b.date||'').localeCompare(a.date||'') || b.created-a.created);
}

/* ---------- render ---------- */
const icons = {
  all:'<path d="M3 7h18M3 12h18M3 17h18"/>',
  sent:'<path d="m22 2-7 20-4-9-9-4z"/><path d="M22 2 11 13"/>',
  reg:'<path d="M20 6 9 17l-5-5"/>',
  follow:'<path d="M12 9v4m0 4h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/>',
  docs:'<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M12 17v-6m0 0-3 3m3-3 3 3"/>',
  final:'<path d="M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6z"/><path d="m9 12 2 2 4-4"/>'
};
function renderStats(){
  const total = data.length;
  const cls = {all:'c-pri',sent:'c-info',reg:'c-ok',follow:'c-warn',docs:'c-info',final:'c-ok'};
  const lbl = {all:'کل تامین‌کنندگان',sent:'لینک ارسال‌شده',reg:'ثبت‌نام شده',follow:'نیازمند پیگیری زمینه فعالیت',docs:'مستندات ارسال‌شده',final:'تایید نهایی شده'};
  $('stats').innerHTML = statKeys.map(k=>{
    const fn = tabsDef.find(t=>t[0]===k)[2];
    const n = data.filter(fn).length, p = total ? Math.round(n/total*100) : 0;
    return `<div class="stat ${cls[k]} ${view===k?'active':''}" data-view="${k}">
      <div class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${icons[k]}</svg></div>
      <div class="num">${toFa(n)}</div><div class="lbl">${lbl[k]}</div>
      <div class="bar"><i style="width:${k==='all'?100:p}%"></i></div></div>`;
  }).join('');
}
function renderTabs(){
  const base = filtered(true);
  $('tabs').innerHTML = tabsDef.map(([k,l,fn])=>`<button class="tab ${view===k?'active':''}" data-view="${k}">${l}<b>${toFa(base.filter(fn).length)}</b></button>`).join('');
}
const badge = (ok,yes,no,cls=['b-ok','b-bad'],id,field) =>
  `<button class="badge ${ok?cls[0]:cls[1]}" data-toggle="${field}" data-id="${id}" title="برای تغییر کلیک کنید">${ok?yes:no}</button>`;
function renderTable(){
  const rows = filtered();
  $('empty').style.display = rows.length ? 'none' : 'block';
  const wait = '<span class="badge b-mute" style="cursor:default">—</span>';
  $('tbody').innerHTML = rows.map((r,i)=>`<tr>
    <td data-label="#">${toFa(i+1)}</td>
    <td data-label="نام مجموعه"><div><div class="name">${esc(r.name)}</div>${r.regName&&r.regName!==r.name?`<div class="sub">نام در سامانه: ${esc(r.regName)}</div>`:''}${r.notes?`<div class="sub">${esc(r.notes)}</div>`:''}</div></td>
    <td data-label="موبایل"><span class="ltr">${toFa(esc(r.mobile))}</span></td>
    <td data-label="تاریخ دریافت">${fmtJ(r.date)}</td>
    <td data-label="مسئول / معرف"><div><div>${esc(r.contact)||'—'}</div><div class="sub">معرف: ${esc(r.referrer)||'—'}</div></div></td>
    <td data-label="لینک ارسال"><div>${badge(r.linkSent,'ارسال شده','ارسال نشده',['b-info','b-bad'],r.id,'linkSent')}${r.platform?`<div style="margin-top:4px"><span class="plat">${esc(r.platform)}</span></div>`:''}</div></td>
    <td data-label="ثبت‌نام">${badge(r.registered,'ثبت‌نام شده','ثبت‌نام نشده',['b-ok','b-bad'],r.id,'registered')}</td>
    <td data-label="زمینه فعالیت">${r.registered ? badge(r.activity,'انتخاب شده','پیگیری شود',['b-ok','b-warn'],r.id,'activity') : wait}</td>
    <td data-label="مستندات">${r.registered ? badge(r.docs,'ارسال شده','ارسال نشده',['b-ok','b-warn'],r.id,'docs') : wait}</td>
    <td data-label="تایید نهایی">${r.docs ? badge(r.final,'تایید شد','منتظر تایید',['b-ok','b-warn'],r.id,'final') : wait}</td>
    <td data-label="عملیات" class="no-print"><div class="row-actions">
      <button class="btn icon" data-edit="${r.id}" title="ویرایش"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></button>
      <button class="btn icon danger" data-del="${r.id}" title="حذف"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2m-9 0 1 14h8l1-14"/></svg></button>
    </div></td></tr>`).join('');
  $('countTxt').textContent = `${toFa(rows.length)} مورد از ${toFa(data.length)} مورد`;
}
function refreshSelects(){
  const refs = [...new Set(data.map(r=>r.referrer).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'fa'));
  const cur = $('fRef').value;
  $('fRef').innerHTML = '<option value="">همه معرف‌ها</option>'+refs.map(r=>`<option>${esc(r)}</option>`).join('');
  $('fRef').value = refs.includes(cur)?cur:'';
  $('refList').innerHTML = refs.map(r=>`<option value="${esc(r)}">`).join('');
}
function render(){ refreshSelects(); renderStats(); renderTabs(); renderTable(); }

/* ---------- form ---------- */
function fillDate(y,m,d){
  const [cy] = nowJ();
  $('dy').innerHTML = Array.from({length:8},(_,i)=>cy-5+i).concat(y&&(y<cy-5||y>cy+2)?[y]:[]).sort().map(v=>`<option value="${v}">${toFa(v)}</option>`).join('');
  $('dm').innerHTML = MONTHS.map((n,i)=>`<option value="${i+1}">${n}</option>`).join('');
  $('dy').value=y; $('dm').value=m; fillDays(d);
}
function fillDays(d){
  const n = jDays(+$('dy').value,+$('dm').value);
  $('dd').innerHTML = Array.from({length:n},(_,i)=>`<option value="${i+1}">${toFa(i+1)}</option>`).join('');
  $('dd').value = Math.min(d||1,n);
}
const setToday = () => { const [y,m,d]=nowJ(); fillDate(y,m,d); };
const radio = (name,val) => document.querySelector(`input[name="${name}"][value="${val}"]`).checked = true;
const getRadio = name => document.querySelector(`input[name="${name}"]:checked`).value==='yes';

function openForm(id){
  editId = id||null;
  const r = id ? data.find(x=>x.id===id) : null;
  $('mTitle').textContent = r ? 'ویرایش اطلاعات تامین‌کننده' : 'ثبت تامین‌کننده جدید';
  $('name').value = r?.name||''; $('mobile').value = r?.mobile||'';
  $('contact').value = r?.contact||''; $('referrer').value = r?.referrer||'';
  $('platform').value = r?.platform||'';
  $('regName').value = r?.regName||''; $('notes').value = r?.notes||'';
  radio('reg', r?.registered?'yes':'no'); radio('act', r?.activity?'yes':'no');
  radio('link', r?.linkSent?'yes':'no'); radio('docs', r?.docs?'yes':'no'); radio('fin', r?.final?'yes':'no');
  if(r?.date){ const [y,m,d]=isoToJ(r.date); fillDate(y,m,d); } else setToday();
  ['name','mobile'].forEach(k=>$(k).classList.remove('invalid'));
  $('eName').style.display=$('eMobile').style.display='none';
  $('overlay').classList.add('open'); document.body.style.overflow='hidden';
  setTimeout(()=>$('name').focus(),50);
}
const closeForm = () => { $('overlay').classList.remove('open'); document.body.style.overflow=''; };

const normMobile = s => { let m = toEn(s).replace(/\D/g,''); if(m.startsWith('98')&&m.length===12) m='0'+m.slice(2); if(m.length===10&&m.startsWith('9')) m='0'+m; return m; };

async function submitForm(e){
  e.preventDefault();
  const name = $('name').value.trim(), mobile = normMobile($('mobile').value);
  let ok = true;
  $('name').classList.toggle('invalid',!name); $('eName').style.display = name?'none':'block'; if(!name) ok=false;
  let msg='';
  if(!/^09\d{9}$/.test(mobile)) msg='شماره موبایل معتبر نیست (مثال: 09123456789).';
  else if(data.some(r=>r.mobile===mobile && r.id!==editId)) msg='این شماره قبلاً ثبت شده است.';
  $('mobile').classList.toggle('invalid',!!msg); $('eMobile').textContent=msg; $('eMobile').style.display=msg?'block':'none'; if(msg) ok=false;
  if(!ok) return;
  const rec = {
    name, mobile,
    date: jToIso(+$('dy').value,+$('dm').value,+$('dd').value),
    contact: $('contact').value.trim(), referrer: $('referrer').value.trim(),
    linkSent: getRadio('link'), platform: $('platform').value,
    docs: getRadio('docs'), final: getRadio('docs') && getRadio('fin'),
    registered: getRadio('reg'), activity: getRadio('act'),
    regName: $('regName').value.trim(), notes: $('notes').value.trim()
  };
  try {
    if(editId){
      Object.assign(data.find(r=>r.id===editId), rec);
      await saveRecord(data.find(r=>r.id===editId));
      toast('تغییرات ذخیره شد ✓');
    } else {
      const newRec = {...rec, id: Date.now().toString(36)+Math.random().toString(36).slice(2,6), created: Date.now()};
      await saveRecord(newRec);
      data.unshift(newRec);
      toast('تامین‌کننده ثبت شد ✓');
    }
    closeForm(); render();
  } catch(err) {
    console.error(err);
    toast('خطا در ذخیره روی سرور');
  }
}

/* ---------- export ---------- */
function download(name, content, type){
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([content],{type})); a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function exportXlsx(){
  const rows = filtered();
  if(!rows.length){ toast('موردی برای خروجی وجود ندارد'); return; }
  const head = ['ردیف','نام مجموعه','شماره موبایل','تاریخ دریافت','مسئول مجموعه','معرف','لینک ارسال شده','بستر ارسال','نام در سامانه وندور','ثبت‌نام شده','زمینه فعالیت انتخاب شده','مستندات ارسال شده','تایید نهایی','توضیحات'];
  const yn = v => v?'بله':'خیر';
  const aoa = [head].concat(rows.map((r,i)=>[
    i+1, r.name, r.mobile, fmtJ(r.date), r.contact, r.referrer, yn(r.linkSent), r.platform, r.regName,
    yn(r.registered), r.registered?yn(r.activity):'—', r.registered?yn(r.docs):'—', r.docs?yn(r.final):'—', r.notes
  ]));
  const [y,m,d]=nowJ(); const base=`vendors-${y}-${pad(m)}-${pad(d)}`;
  if(window.XLSX){
    const ws = XLSX.utils.aoa_to_sheet(aoa);
    ws['!cols'] = [6,26,15,13,18,16,12,12,24,12,16,14,12,30].map(w=>({wch:w}));
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'تامین‌کنندگان');
    wb.Workbook = { Views:[{RTL:true}] };
    XLSX.writeFile(wb, base+'.xlsx');
  } else {
    // fallback: semicolon-separated CSV (matches Excel's regional list separator)
    const cell = v => `"${String(v??'').replace(/"/g,'""')}"`;
    const csv = 'sep=;\r\n'+aoa.map(r=>r.map(cell).join(';')).join('\r\n');
    download(base+'.csv','\ufeff'+csv,'text/csv;charset=utf-8');
  }
  toast('فایل اکسل ساخته شد');
}

/* ---------- events ---------- */
document.addEventListener('click', e=>{
  const t = e.target.closest('[data-view],[data-edit],[data-del],[data-toggle]');
  if(!t) return;
  if(t.dataset.view){ view=t.dataset.view; render(); }
  else if(t.dataset.edit) openForm(t.dataset.edit);
  else if(t.dataset.del){ const r=data.find(x=>x.id===t.dataset.del); if(confirm(`«${r.name}» حذف شود؟`)){
      deleteRecord(r.id).then(()=>{ data=data.filter(x=>x.id!==r.id); render(); toast('حذف شد'); }).catch(e=>{ console.error(e); toast('خطا در حذف'); });
    } }
  else if(t.dataset.toggle){ const r=data.find(x=>x.id===t.dataset.id); r[t.dataset.toggle]=!r[t.dataset.toggle];
      saveRecord(r).then(()=>render()).catch(e=>{ console.error(e); toast('خطا در ذخیره'); }); }
});
$('addBtn').onclick = ()=>openForm();
$('closeBtn').onclick = $('cancelBtn').onclick = closeForm;
$('overlay').addEventListener('mousedown', e=>{ if(e.target===$('overlay')) closeForm(); });
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeForm(); });
$('form').addEventListener('submit', submitForm);
$('dy').onchange = $('dm').onchange = ()=>fillDays(+$('dd').value);
$('mobile').addEventListener('input', e=>{ e.target.value = toEn(e.target.value).replace(/\D/g,'').slice(0,11); });
['q','fPlat','fRef'].forEach(id=>$(id).addEventListener('input', ()=>{ renderTabs(); renderTable(); }));
$('resetBtn').onclick = ()=>{ $('q').value=''; $('fPlat').value=''; $('fRef').value=''; view='all'; render(); };
$('csvBtn').onclick = exportXlsx;
$('printBtn').onclick = ()=>window.print();
$('backupBtn').onclick = ()=>{ download('vendors-backup.json', JSON.stringify(data,null,1), 'application/json'); toast('پشتیبان ذخیره شد'); };
$('restoreBtn').onclick = ()=>$('restoreFile').click();
$('restoreFile').onchange = e=>{
  const f=e.target.files[0]; if(!f) return;
  const rd=new FileReader();
  rd.onload=async ()=>{ try{ const arr=JSON.parse(rd.result); if(!Array.isArray(arr)) throw 0;
      if(confirm('اطلاعات فعلی با فایل پشتیبان جایگزین شود؟')){
        // حذف همه و درج مجدد
        await sb.from('vendors').delete().neq('id', '');
        for(const r of arr){ await saveRecord(r); }
        data = arr;
        render();
        toast('بازیابی انجام شد ✓');
      } }
    catch(err){ console.error(err); toast('فایل پشتیبان معتبر نیست یا خطا در سرور'); }
    e.target.value=''; };
  rd.readAsText(f);
};
const applyTheme = t => { document.documentElement.dataset.theme=t; try{localStorage.setItem('vendor-tracker-v1-theme',t)}catch{} };
$('themeBtn').onclick = ()=>applyTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');

/* ---------- init ---------- */
(async function init(){
  let th; try{ th=localStorage.getItem('vendor-tracker-v1-theme'); }catch{}
  applyTheme(th || (matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'));
  $('platform').innerHTML += PLATFORMS.map(p=>`<option>${p}</option>`).join('');
  $('fPlat').innerHTML += PLATFORMS.map(p=>`<option>${p}</option>`).join('');
  const [y,m,d]=nowJ();
  $('todayChip').textContent = `امروز: ${toFa(d)} ${MONTHS[m-1]} ${toFa(y)}`;
  await load();
  render();
})();
})();
</script>
